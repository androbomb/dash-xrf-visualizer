name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed version tag to publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert f"v{version}" == os.environ["RELEASE_TAG"], f"tag v{version} does not match input {os.environ['RELEASE_TAG']}"
          PY
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv build
      - run: uvx --from twine twine check dist/*
      - name: Install the built wheel in a clean env and smoke-test it
        run: |
          uv venv /tmp/xrf-smoke
          uv pip install --python /tmp/xrf-smoke/bin/python --quiet dist/*.whl
          cd /tmp
          /tmp/xrf-smoke/bin/python - <<'PY'
          from xrf_visualizer.data import load_xrf_lines
          from xrf_visualizer.ui import build_app

          assert len(load_xrf_lines()) > 0
          build_app(None)
          print("wheel smoke OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xrf-visualizer/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
