name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to test (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert f"v{version}" == os.environ["RELEASE_TAG"], f"tag v{version} does not match input {os.environ['RELEASE_TAG']}"
          PY
      - run: uv build
      - run: uvx --from twine twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: testpypi-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/xrf-visualizer
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: testpypi-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
