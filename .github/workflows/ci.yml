name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run --locked --python ${{ matrix.python-version }} pytest -q
      - run: uv build
      - name: Validate built distributions
        run: |
          uvx --from twine twine check dist/*
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          wheel, source = list(Path("dist").glob("*.whl")), list(Path("dist").glob("*.tar.gz"))
          assert len(wheel) == len(source) == 1
          assert any(name.endswith("xrf_visualizer/data/XRFlines.json") for name in zipfile.ZipFile(wheel[0]).namelist())
          assert any(name.endswith("xrf_visualizer/data/XRFlines.json") for name in tarfile.open(source[0]).getnames())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
