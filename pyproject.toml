[project]
name = "xrf-visualizer"
version = "0.1.0"
description = "Plotly Dash visualizer for XRF cubes (HDF5/.npz/.npy): 2-D map + spectrum with spectral-interval and ROI selection."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # I/O
    "numpy",
    "h5py",
    # Compute: CPU JAX is the default (no GPU context, no VRAM pre-allocation).
    # GPU is an opt-in variant, see deploy/uv/README.md (jax[cuda12]).
    "jax",
    # UI
    "dash",
    "plotly",
    "dash-bootstrap-components>=2.0.4",
]

[dependency-groups]
dev = [
    "pytest",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xrf_visualizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
